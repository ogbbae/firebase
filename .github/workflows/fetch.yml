name: fetch-texts
on:
  push:
    branches: [fetch-texts]
    paths: [tools/**, .github/workflows/fetch.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch.py
      - run: |
          git config user.name "fetch-bot"; git config user.email "bot@users.noreply.github.com"
          git add raw && git commit -m "raw texts" && git push || true
