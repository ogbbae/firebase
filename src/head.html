<title>FIREBASE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="FIREBASE — профессиональная база знаний о пожаротушении: справочник РТП, разборы реальных пожаров, библиотека, нормативная база и обучение.">
<meta property="og:title" content="FIREBASE — пожарная база знаний">
<meta property="og:description" content="Справочные материалы, анализ реальных пожаров, профессиональная литература и инструменты для обучения в единой системе.">
<meta property="og:type" content="website">
<meta name="robots" content="index,follow" id="robotsMeta">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky command bar · centered 1200px workspace · catalog = filter rail + card grid */
:root{
  --bg:#111418;--card:#1A1F25;--alt:#222831;--line:#303741;--line2:#3B4350;
  --fg:#F5F7FA;--fg2:#A7B0BC;--fg3:#7C8794;
  --red:#E53935;--red-ink:#FF6B66;--red-soft:rgba(229,57,53,.13);
  --ok:#43A77A;--ok-soft:rgba(67,167,122,.14);--warn:#F0A43C;--warn-soft:rgba(240,164,60,.14);
  --info:#6FA8DC;--info-soft:rgba(111,168,220,.14);
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;--r-sm:6px;
  color-scheme:dark;
}
:root[data-theme="light"],:root[data-ui="light"]{
  --bg:#F3F4F6;--card:#FFFFFF;--alt:#E9ECEF;--line:#D5DAE0;--line2:#C3CAD3;
  --fg:#12161B;--fg2:#4B5562;--fg3:#6B7480;
  --red:#C62828;--red-ink:#B3261E;--red-soft:rgba(198,40,40,.09);
  --ok:#23704F;--ok-soft:rgba(35,112,79,.10);--warn:#9A5B00;--warn-soft:rgba(176,106,0,.11);
  --info:#2B6CA3;--info-soft:rgba(43,108,163,.10);
  color-scheme:light;
}
:root[data-ui="dark"]{
  --bg:#111418;--card:#1A1F25;--alt:#222831;--line:#303741;--line2:#3B4350;
  --fg:#F5F7FA;--fg2:#A7B0BC;--fg3:#7C8794;
  --red:#E53935;--red-ink:#FF6B66;--red-soft:rgba(229,57,53,.13);
  --ok:#43A77A;--ok-soft:rgba(67,167,122,.14);--warn:#F0A43C;--warn-soft:rgba(240,164,60,.14);
  --info:#6FA8DC;--info-soft:rgba(111,168,220,.14);
  color-scheme:dark;
}
:root[data-ui="contrast"]{
  --bg:#000000;--card:#0A0A0A;--alt:#1C1C1C;--line:#6B6B6B;--line2:#8A8A8A;
  --fg:#FFFFFF;--fg2:#E6E6E6;--fg3:#C8C8C8;
  --red:#FF4D4D;--red-ink:#FF7A7A;--red-soft:rgba(255,77,77,.2);
  --ok:#5FE3A1;--ok-soft:rgba(95,227,161,.16);--warn:#FFC24D;--warn-soft:rgba(255,194,77,.16);
  --info:#8CC8FF;--info-soft:rgba(140,200,255,.16);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:84px}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--card)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;height:60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.logo b{font:700 15px/1 var(--f-display);letter-spacing:.06em}
.logo small{display:block;font-size:10.5px;color:var(--fg3);letter-spacing:.04em;margin-top:3px}
.nav{display:flex;gap:2px;margin:0 auto;min-width:0}
.nav a{padding:8px 11px;border-radius:var(--r-sm);text-decoration:none;color:var(--fg2);font-size:14px;font-weight:500;white-space:nowrap;transition:color .15s,background .15s}
.nav a:hover{color:var(--fg);background:var(--alt)}
.nav a[aria-current="page"]{color:var(--fg);background:var(--alt);box-shadow:inset 0 -2px 0 var(--red)}
.tools{display:flex;gap:4px;flex-shrink:0}
.ibtn{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:var(--r-sm);border:1px solid transparent;background:none;cursor:pointer;color:var(--fg2);text-decoration:none}
.ibtn:hover{background:var(--alt);color:var(--fg)}
.ibtn svg{width:20px;height:20px}
.ibtn .dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font:600 10px/16px var(--f-mono);text-align:center}
.burger{display:none}
.tools{position:relative}
.thmenu{position:absolute;right:0;top:calc(100% + 8px);z-index:80;width:240px;background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.thmenu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:14px}
.thmenu button:hover,.thmenu button[aria-checked="true"]{background:var(--alt)}
.thmenu .sw{width:28px;height:18px;border-radius:4px;border:1px solid var(--line2);flex-shrink:0;display:flex;overflow:hidden}
.thmenu .sw i{flex:1}
.thmenu small{display:block;color:var(--fg3);font-size:12px}
.thgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thcard{border:1px solid var(--line2);border-radius:10px;padding:10px;background:none;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px}
.thcard[aria-pressed="true"]{border-color:var(--red);box-shadow:0 0 0 2px var(--red-soft)}
.thcard .pv{height:54px;border-radius:6px;display:flex;flex-direction:column;justify-content:space-between;padding:7px;border:1px solid rgba(128,128,128,.35)}
.thcard .pv i{display:block;height:6px;border-radius:3px}
@media (max-width:1060px){.nav{display:none}.burger{display:grid}.tools{margin-left:auto}}
@media (max-width:440px){.ibtn{width:34px}.tools{gap:0}.logo small{display:none}.logo b{font-size:13px}.bar-in{gap:6px}}
.drawer{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);display:flex;justify-content:flex-end}
.drawer nav{width:min(320px,86vw);height:100%;background:var(--card);border-left:1px solid var(--line);padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px 16px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.drawer a{padding:13px 12px;border-radius:var(--r-sm);text-decoration:none;font-weight:500}
.drawer a[aria-current="page"]{background:var(--alt);box-shadow:inset 3px 0 0 var(--red)}
.drawer .sep{height:1px;background:var(--line);margin:8px 0}

/* page */
main{max-width:1240px;margin:0 auto;padding-block:28px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:70vh}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--fg3);margin-bottom:14px}
.crumbs a{color:var(--fg2);text-decoration:none}.crumbs a:hover{color:var(--fg)}
h1,h2,h3{text-wrap:balance;margin:0}
.h1{font:700 clamp(24px,3.4vw,34px)/1.18 var(--f-display);letter-spacing:-.01em}
.h2{font:600 20px/1.3 var(--f-body)}
.h3{font:600 16px/1.35 var(--f-body)}
.lead{color:var(--fg2);font-size:16px;max-width:70ch;margin:10px 0 0}
.eyebrow{font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--fg3)}
.muted{color:var(--fg2)}.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sec{margin-top:40px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 15px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--card);cursor:pointer;text-decoration:none;font-weight:500;font-size:14px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--fg3);background:var(--alt)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;color:var(--fg2)}
.btn.ghost:hover{color:var(--fg);background:var(--alt)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.fav-btn[aria-pressed="true"]{color:var(--red-ink);border-color:var(--red)}
.fav-btn[aria-pressed="true"] svg{fill:currentColor}

/* chips / badges */
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 12px;border-radius:16px;border:1px solid var(--line2);background:none;cursor:pointer;font-size:13px;color:var(--fg2);text-decoration:none}
.chip:hover{color:var(--fg);border-color:var(--fg3)}
.chip[aria-pressed="true"]{background:var(--red-soft);border-color:var(--red);color:var(--fg)}
.chip .n{font-family:var(--f-mono);font-size:11px;color:var(--fg3)}
.tag{display:inline-block;padding:1px 8px;border-radius:4px;background:var(--alt);color:var(--fg2);font-size:12px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:4px;font:600 10.5px/1.6 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;white-space:nowrap}
.b-fact{color:var(--ok);background:var(--ok-soft)}
.b-official{color:var(--info);background:var(--info-soft)}
.b-prelim{color:var(--warn);background:var(--warn-soft)}
.b-expert{color:var(--fg2);background:var(--alt)}
.b-none{color:var(--fg3);background:none;border-style:dashed}
.b-red{color:var(--red-ink);background:var(--red-soft)}
.b-demo{color:var(--warn);background:var(--warn-soft)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.grid.g2{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
@media (max-width:420px){.grid,.grid.g2{grid-template-columns:1fr}}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--line2)}
.card.link:hover{border-color:var(--fg3)}
.card .t{font-weight:600;font-size:15.5px;line-height:1.35;text-decoration:none}
.card .t::after{content:"";position:absolute;inset:0;border-radius:var(--r)}
.card .t:hover{text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:3px}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--fg3)}
.card .d{color:var(--fg2);font-size:14px;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{margin-top:auto;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card .foot>*{position:relative;z-index:1}
.card .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .top>*{position:relative;z-index:1}
.kind{font:600 10.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fg3)}
.cover{aspect-ratio:3/4;width:72px;flex-shrink:0;border-radius:4px;background:var(--alt);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;padding:7px;font-size:8.5px;line-height:1.2;color:var(--fg2);overflow:hidden}
.cover i{display:block;height:3px;width:60%;background:var(--red);border-radius:2px}

/* hero */
.hero{padding:34px 0 8px;display:grid;gap:22px}
.hero .h1{font-size:clamp(28px,4.6vw,48px);max-width:18ch}
.hero .lead{font-size:17px}
.bigsearch{position:relative;max-width:760px}
.bigsearch input{width:100%;height:58px;padding:0 120px 0 52px;border-radius:12px;border:1px solid var(--line2);background:var(--card);font-size:16px}
.bigsearch input:focus{border-color:var(--red);outline:none;box-shadow:0 0 0 3px var(--red-soft)}
.bigsearch>svg{position:absolute;left:18px;top:19px;width:20px;height:20px;color:var(--fg3)}
.bigsearch .btn{position:absolute;right:8px;top:8px;min-height:42px}
.ac{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.ac button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;padding:9px 10px;border:0;background:none;border-radius:6px;cursor:pointer}
.ac button[aria-selected="true"],.ac button:hover{background:var(--alt)}
.ac .k{font:600 10px/1 var(--f-mono);color:var(--fg3);text-transform:uppercase;letter-spacing:.08em;width:84px;flex-shrink:0}
.ac small{color:var(--fg3);margin-left:auto}

/* tool tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tile{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);text-decoration:none}
.tile:hover{border-color:var(--fg3)}
.tile .ic{width:38px;height:38px;border-radius:8px;background:var(--alt);display:grid;place-items:center;color:var(--red-ink);flex-shrink:0}
.tile .ic svg{width:20px;height:20px}
.tile b{display:block;font-size:14px}.tile span{font-size:12.5px;color:var(--fg3)}

/* catalog layout */
.cat{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;margin-top:22px}
@media (max-width:900px){.cat{grid-template-columns:1fr}}
.rail{display:flex;flex-direction:column;gap:18px;align-self:start;position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}
@media (max-width:900px){.rail{position:static}}
.railbox>summary{display:none;cursor:pointer;list-style:none;padding:9px 14px;border:1px solid var(--line2);border-radius:var(--r-sm);font-weight:500;font-size:14px}
.railbox>summary::-webkit-details-marker{display:none}
.railbox[open]>summary{margin-bottom:14px}
.railbox .in{display:flex;flex-direction:column;gap:18px}
@media (max-width:900px){.railbox>summary{display:inline-flex}}
.rail .grp{display:flex;flex-direction:column;gap:2px}
.rail .grp .eyebrow{margin-bottom:8px}
.rail button.f{display:flex;justify-content:space-between;gap:8px;text-align:left;padding:7px 10px;border-radius:6px;border:0;background:none;cursor:pointer;color:var(--fg2);font-size:13.5px}
.rail button.f:hover{background:var(--alt);color:var(--fg)}
.rail button.f[aria-pressed="true"]{background:var(--alt);color:var(--fg);box-shadow:inset 2px 0 0 var(--red)}
.rail button.f .n{font:12px var(--f-mono);color:var(--fg3)}
@media (max-width:900px){.rail .grp.wrapm{flex-direction:row;flex-wrap:wrap;gap:6px}.rail .grp.wrapm .eyebrow{width:100%}.rail .grp.wrapm button.f{border:1px solid var(--line2);border-radius:16px;padding:5px 12px}}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12.5px;color:var(--fg2);font-weight:500}
.inp,select.inp,textarea.inp{height:40px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--card);min-width:0}
textarea.inp{height:auto;min-height:110px;padding:10px 12px;resize:vertical;line-height:1.5}
.inp:focus{border-color:var(--red);outline:none;box-shadow:0 0 0 3px var(--red-soft)}
.inp.err{border-color:var(--red)}
.ferr{color:var(--red-ink);font-size:12.5px}
.search-inline{position:relative;flex:1 1 260px}
.search-inline input{width:100%;padding-left:36px}
.search-inline svg{position:absolute;left:11px;top:11px;width:18px;height:18px;color:var(--fg3)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r-sm);overflow:hidden}
.seg button{border:0;background:none;padding:0 12px;height:38px;cursor:pointer;color:var(--fg2);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--alt);color:var(--fg)}
.count{font-size:13px;color:var(--fg3);margin-left:auto}

/* list view */
.list{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.list .li{display:grid;grid-template-columns:110px minmax(0,1fr) 160px 120px;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);text-decoration:none}
.list .li:first-child{border-top:0}
.list .li:hover{background:var(--alt)}
@media (max-width:700px){.list .li{grid-template-columns:1fr;gap:4px}}

/* empty */
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:34px 20px;text-align:center;color:var(--fg2)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:6px}

/* article */
.art{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:36px;margin-top:6px}
.art>*{min-width:0}
@media (max-width:980px){.art{grid-template-columns:1fr}}
.art-head{display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:0}
.facts div{padding:11px 14px;min-width:0;box-shadow:0 0 0 .5px var(--line)}
.facts dt{font-size:11.5px;color:var(--fg3);margin-bottom:3px}
.facts dd{margin:0;font-weight:500;font-size:14px;overflow-wrap:anywhere}
.prose{max-width:74ch;font-size:15.5px;line-height:1.7}
.prose h2{font:600 20px/1.3 var(--f-body);margin:34px 0 12px;padding-top:6px}
.prose h3{font:600 16.5px/1.35 var(--f-body);margin:24px 0 8px}
.prose p{margin:0 0 12px}
.prose ul,.prose ol{margin:0 0 14px;padding-left:22px}
.prose li{margin:4px 0}
.prose a{color:var(--red-ink);text-underline-offset:3px}
.prose code{font:13px var(--f-mono);background:var(--alt);padding:1px 5px;border-radius:4px}
.prose .note{border:1px solid var(--line2);border-left:3px solid var(--warn);border-radius:0;padding:10px 14px;margin:0 0 14px;background:var(--warn-soft);color:var(--fg)}
.prose .formula{font:14px/1.6 var(--f-mono);background:var(--alt);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 14px;overflow-x:auto;white-space:pre}
.tblw{overflow-x:auto;margin:0 0 16px;border:1px solid var(--line);border-radius:8px}
.tblw table{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
.tblw th,.tblw td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
.tblw th{background:var(--alt);font-weight:600;font-size:13px;border-top:0}
sup.ref a{font:600 10.5px var(--f-mono);color:var(--red-ink);text-decoration:none;cursor:pointer;padding:0 1px}
.side{display:flex;flex-direction:column;gap:16px;align-self:start;position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}
@media (max-width:980px){.side{position:static}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel .eyebrow{margin-bottom:10px;display:block}
.toc{display:flex;flex-direction:column}
